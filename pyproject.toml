[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nullgrant"
version = "1.0.0"
description = "Configuration auditing for OAuth 2.0 / OpenID Connect authorization servers, against RFC 9700."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "oauth", "oauth2", "openid-connect", "oidc", "security", "audit",
    "pkce", "rfc9700", "authorization-server", "appsec",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = []

[project.optional-dependencies]
dev = []

[project.urls]
Homepage = "https://github.com/YOUR-USERNAME/nullgrant"
Repository = "https://github.com/YOUR-USERNAME/nullgrant"
Issues = "https://github.com/YOUR-USERNAME/nullgrant/issues"
Changelog = "https://github.com/YOUR-USERNAME/nullgrant/blob/main/CHANGELOG.md"

[project.scripts]
nullgrant = "nullgrant.cli:main"

[tool.setuptools]
packages = ["nullgrant"]
include-package-data = true

[tool.setuptools.package-data]
nullgrant = ["py.typed"]

# --- optional tool config; none of these are required to run the tool ---

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
